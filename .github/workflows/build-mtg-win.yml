name: Build MTG v1 Windows
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Clone and Build MTG v1.0.11
        run: |
          git clone --depth 1 --branch v1.0.11 https://github.com
          cd mtg
          go build -o ../mtg.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-windows
          path: mtg.exe
