name: Build MTG v1 Windows
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Download and Build MTG v1.0.11
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com" -OutFile "mtg.zip"
          Expand-Archive -Path "mtg.zip" -DestinationPath "."
          cd mtg-1.0.11
          go build -o ..\mtg.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-windows
          path: mtg.exe
