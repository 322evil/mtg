name: Build MTG v1 Windows
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install MTG v1.0.11
        shell: pwsh
        run: |
          $env:GOBIN = (Get-Location).Path
          go install ://github.com
      - uses: actions/upload-artifact@v4
        with:
          name: mtg-windows
          path: mtg.exe
